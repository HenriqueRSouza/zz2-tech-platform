[project]
name = "zz2-tech-support"
version = "2.0.0"
description = "ZZ2 Tech Support Platform - modular FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# S101: assert is the right tool in tests and in the verification steps of the
#       one-off migration scripts.
# B008: FastAPI's Depends() in a default argument is the documented idiom.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# The migration scripts embed literal HTML and JavaScript that must match the
# source byte-for-byte; reflowing those lines would break the match.
"scripts/*.py" = ["E501", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
