# ZZ2 Tech Support Platform — nginx reverse proxy.
#
#   sudo cp deploy/nginx/zz2.conf /etc/nginx/sites-available/zz2
#   sudo ln -s /etc/nginx/sites-available/zz2 /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d suporte.example.com.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx does the three things the application deliberately does not: terminate
# TLS, absorb slow and malformed connections, and cap request bodies before a
# single byte reaches Python.

# Slow-request protection. The monolith served every connection from its own
# thread with no timeouts at all, so a handful of slowloris connections could
# exhaust it. These limits are the fix, and they belong here rather than in the
# application: nginx can hold thousands of idle sockets cheaply.
limit_req_zone $binary_remote_addr zone=zz2_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=zz2_login:10m rate=1r/s;

upstream zz2_app {
    server 127.0.0.1:8080 fail_timeout=10s;
    keepalive 16;
}

# -- HTTP: redirect only -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name suporte.example.com.br;

    # Certbot's renewal challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name suporte.example.com.br;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/suporte.example.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suporte.example.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Never announce the version — it is free reconnaissance for anyone matching
    # a version against a CVE list.
    server_tokens off;

    # 26 MB: the largest upload the application accepts (a 25 MB PDF manual plus
    # base64 overhead). Rejected here, so an oversized body never reaches Python
    # and never occupies a worker thread.
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    access_log /var/log/nginx/zz2.access.log;
    error_log  /var/log/nginx/zz2.error.log warn;

    # -- Proxy defaults --------------------------------------------------------
    location / {
        limit_req zone=zz2_general burst=40 nodelay;

        proxy_pass http://zz2_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Long enough for an analytics rebuild; short enough that a wedged
        # request does not hold a connection open indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # The application sets its own security headers, including a CSP built
        # from its configuration. Adding them here too risks two conflicting
        # values on one response.
        proxy_hide_header X-Powered-By;
    }

    # The sign-in page is the one endpoint worth rate limiting hard: it is the
    # only unauthenticated path that leads anywhere, and password guessing
    # against Supabase happens through the browser, not through this server.
    location = /login.html {
        limit_req zone=zz2_login burst=5 nodelay;
        proxy_pass http://zz2_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probes: no rate limit and no access log. A throttled health check
    # reports the service down under load, and the log would be nothing else.
    location = /healthz {
        access_log off;
        proxy_pass http://zz2_app;
        proxy_set_header Host $host;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://zz2_app;
        proxy_set_header Host $host;
    }

    # Static assets. Compressed here rather than in the application: nginx does
    # it faster and caches the result. Revalidation is left to the application's
    # ETag — see the note in zz2/api/routers/pages.py on why these must not be
    # cached for long without a build hash.
    location /static/ {
        proxy_pass http://zz2_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
        gzip_vary on;
    }
}
