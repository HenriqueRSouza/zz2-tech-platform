<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" type="image/jpeg" href="/static/images/favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/js/shared/theme-init.js"></script>
<script src="/static/js/shared/session.js"></script>
<title>ZZ2 Tech Support · Tickets</title>
<link rel="stylesheet" href="/static/css/tickets.1.css">
</head>
<body>
<!-- ZZ2 shared navigation menu -->
<link rel="stylesheet" href="/static/css/tickets.2.css">
<div class="zz2-nav-overlay" id="zz2NavOverlay"></div>
<nav class="zz2-nav" id="zz2Nav" aria-hidden="true">
  <div class="zz2-nav-head">
    <span class="zz2-nav-title">ZZ2 <b>Navigation</b></span>
    <button class="zz2-nav-x" id="zz2NavClose" aria-label="Close menu">&times;</button>
  </div>
  <div class="zz2-nav-links">
    <a class="zz2-nav-link" href="/dashboard.html" data-perm="dashboard" data-page="dashboard"><span class="i">⬡</span>Dashboard</a>
    <a class="zz2-nav-link" href="/index.html" data-perm="" data-page="index"><span class="i">🔧</span>Kit &amp; Ticket Tool</a>
    <a class="zz2-nav-link" href="/tickets.html" data-perm="tickets" data-page="tickets"><span class="i">🗂️</span>Tickets</a>
    <a class="zz2-nav-link" href="/analytics.html" data-perm="analytics" data-page="analytics"><span class="i">📊</span>Analytics</a>
    <a class="zz2-nav-link" href="/users.html" data-perm="manage_users|manage_roles" data-page="users"><span class="i">👥</span>Users &amp; Roles</a>
    <a class="zz2-nav-link" href="/settings.html" data-perm="system_settings" data-page="settings"><span class="i">⚙️</span>System Settings</a>
  </div>
</nav>
<script src="/static/vendor/supabase.js"></script>
<script src="/static/js/shared/nav.js"></script>
<!-- /ZZ2 shared navigation menu -->


<header class="topbar">
  <button class="zz2-burger" onclick="zz2NavToggle()" aria-label="Open menu">☰</button>
  <a class="brand" href="dashboard.html" title="Back to dashboard">
    <img class="logo" src="/static/images/zz2-logo.png" alt="ZZ2">
    <span class="t">Tickets</span>
  </a>
  <span class="spacer"></span>
  <button class="tb-toggle" id="themeToggle" onclick="zz2ToggleTheme()" title="Switch to dark mode" aria-label="Switch color theme">☀️</button>
  <div class="meta" id="meta">—</div>
  <button class="tb-btn" id="btn-refresh" title="Reload tickets from Supabase">↻ Refresh</button>
  <button class="tb-btn primary" id="btn-new">+ New ticket</button>
</header>

<div class="toolbar" id="toolbar" style="display:none">
  <div class="search">
    <span class="ic">⌕</span>
    <input id="q" type="text" placeholder="Search tickets — client, kit, vehicle, issue, tech, status…">
  </div>
  <span class="count" id="count"></span>
</div>

<div class="gridwrap" id="gridwrap">
  <div class="loading"><div><div class="spinner"></div><div>Loading tickets…</div></div></div>
</div>

<!-- New ticket modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>New ticket</h2>
    <div class="body">
      <div class="fld"><label>Tech</label><input id="n-tech"></div>
      <div class="fld"><label>Client</label><input id="n-client"></div>
      <div class="fld"><label>Product / Kit</label><input id="n-product"></div>
      <div class="fld"><label>Vehicle</label><input id="n-vehicle"></div>
      <div class="fld"><label>Serial #</label><input id="n-serial"></div>
      <div class="fld"><label>Status</label>
        <select id="n-status">
          <option value=""></option>
          <option>Resolved</option><option>W.O.E.</option><option>No solution</option>
          <option>Waiting for customer feedback</option><option>RMA/Return</option>
          <option>RMA - ADV REP REQ GROUND</option><option>RMA - ADV REP REQ OVERNIGHT</option>
          <option>DISTRIBUTOR</option><option>Field Destroy</option>
        </select>
      </div>
      <div class="fld full"><label>Issue</label><textarea id="n-issue"></textarea></div>
      <div class="fld full"><label>Resolution</label><textarea id="n-resolution"></textarea></div>
      <div class="fld full"><label>Notes</label><textarea id="n-notes"></textarea></div>
    </div>
    <div class="foot">
      <span class="msg" id="n-msg"></span>
      <button class="btn" id="n-cancel">Cancel</button>
      <button class="btn accent" id="n-save">Create ticket</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/static/js/tickets.3.js"></script>
<script src="/static/js/shared/theme-toggle.js"></script>
</body>
</html>
