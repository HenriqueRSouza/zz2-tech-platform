<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* zz2 theme: apply saved choice before paint; default stays light */(function(){try{var t=localStorage.getItem('zz2-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <title>Tech Support Platform (TSP)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1d21;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,205,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,205,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      background: #22262c;
      border: 1px solid #2e333a;
      border-radius: 16px;
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      position: relative;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-wrap img {
      height: 52px;
      width: auto;
    }

    .tagline {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: #2e333a;
      margin: 28px 0;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: #1a1d21;
      border: 1px solid #2e333a;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      color: #f3f4f6;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #ffcd00;
    }

    .field input::placeholder {
      color: #4b5563;
    }

    .login-btn {
      width: 100%;
      background: #ffcd00;
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .login-btn:hover  { background: #f0c000; }
    .login-btn:active { transform: scale(0.99); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* "Sign in with Microsoft" (SAML). Hidden until /api/config says it is on. */
    .sso-sep {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0 10px; font-size: 11px; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .sso-sep::before, .sso-sep::after { content: ""; flex: 1; height: 1px; background: #2a2f37; }
    .sso-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; box-sizing: border-box; padding: 11px;
      border: 1px solid #3a404a; border-radius: 8px;
      background: transparent; color: #e5e7eb; text-decoration: none;
      font-size: 14px; font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }
    .sso-btn:hover { background: rgba(255,255,255,0.04); border-color: #4b5563; }
    .sso-btn svg { width: 18px; height: 18px; flex: none; }
    .sso-btn + .sso-btn, .ms-btn + .sso-btn { margin-top: 10px; }

    /* "Entrar com Microsoft" (OpenID Connect). Follows Microsoft's sign-in
     * button guidance: four-square logo, Segoe UI 15px semibold, 41px tall,
     * light theme #fff / #8c8c8c border / #5e5e5e text, dark theme #2f2f2f /
     * white text. Hidden until /api/config reports microsoft_enabled. */
    .ms-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; box-sizing: border-box; height: 41px; padding: 0 12px;
      border: 1px solid #2f2f2f; border-radius: 0;
      background: #2f2f2f; color: #ffffff; text-decoration: none;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }
    .ms-btn:hover { background: #3b3b3b; }
    .ms-btn svg { width: 21px; height: 21px; flex: none; }

    .error-msg {
      min-height: 20px;
      font-size: 13px;
      color: #f87171;
      text-align: center;
      margin-top: 12px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #374151;
      margin-top: 32px;
    }

    /* Loading spinner overlay */
    .spinner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(34,38,44,0.7);
      border-radius: 16px;
      align-items: center;
      justify-content: center;
    }
    .spinner.active { display: flex; }
    .spinner-ring {
      width: 36px; height: 36px;
      border: 3px solid #2e333a;
      border-top-color: #ffcd00;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== ZZ2 light theme for login (ADDITIVE) — default shows light; existing design = dark mode ===== */
    :root{color-scheme:dark}
  :root:not([data-theme="dark"]){color-scheme:light}
  :root:not([data-theme="dark"]) body{background:#eef0f3}
  :root:not([data-theme="dark"]) .card{background:#fff;border-color:#e5e7eb;box-shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06)}
  :root:not([data-theme="dark"]) .divider{background:#e5e7eb}
  :root:not([data-theme="dark"]) .field label{color:#6b7280}
  :root:not([data-theme="dark"]) .field input{background:#fff;border-color:#e5e7eb;color:#22262c}
  :root:not([data-theme="dark"]) .field input::placeholder{color:#9ca3af}
  :root:not([data-theme="dark"]) .error-msg{color:#dc2626}
  :root:not([data-theme="dark"]) .footer{color:#9ca3af}
  :root:not([data-theme="dark"]) .sso-sep::before,:root:not([data-theme="dark"]) .sso-sep::after{background:#e5e7eb}
  :root:not([data-theme="dark"]) .sso-btn{border-color:#d1d5db;color:#22262c}
  :root:not([data-theme="dark"]) .sso-btn:hover{background:#f9fafb;border-color:#9ca3af}
  :root:not([data-theme="dark"]) .ms-btn{background:#ffffff;border-color:#8c8c8c;color:#5e5e5e}
  :root:not([data-theme="dark"]) .ms-btn:hover{background:#f3f3f3}
  :root:not([data-theme="dark"]) .spinner{background:rgba(255,255,255,0.72)}
  :root:not([data-theme="dark"]) .spinner-ring{border-color:#e5e7eb;border-top-color:#ffcd00}

  /* floating theme toggle */
  #themeToggle{position:fixed;top:14px;right:14px;z-index:1000;appearance:none;
    border:1px solid rgba(120,130,145,.4);background:rgba(40,44,52,.55);color:#e5e7eb;font:inherit;
    font-size:16px;line-height:1;width:38px;height:38px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  :root:not([data-theme="dark"]) #themeToggle{background:rgba(255,255,255,.8);border-color:#d1d5db;color:#22262c;
    box-shadow:0 1px 3px rgba(16,24,40,.1)}
  #themeToggle:hover{filter:brightness(1.08)}
  
/* zz2-mobile-base */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (max-width: 640px) {
  input, select, textarea { font-size: 16px !important; }   /* no focus-zoom on iOS */
  img, svg, video { max-width: 100%; }
}

/* zz2-mobile-login */
@media (max-width: 640px) {
  body { padding: 16px; }
  .card { padding: 32px 24px 28px; border-radius: 14px; }
}
</style>
</head>
<body>
<button id="themeToggle" onclick="zz2ToggleTheme()" title="Alternar para o modo escuro" aria-label="Alternar tema de cores">☀️</button>
  <div class="card">
    <div class="spinner" id="spinner"><div class="spinner-ring"></div></div>

    <div class="logo-wrap">
      <img src="/images/zz2-logo.png" alt="ZZ2">
      <div class="tagline">Portal de Suporte Técnico</div>
    </div>

    <div class="divider"></div>

    <div id="password-block">
      <div class="field">
        <label for="username">E-mail</label>
        <input type="email" id="username" placeholder="voce@empresa.com"
          autocomplete="email" autocapitalize="none"
          onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>

      <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    </div>

    <div id="sso-block" hidden>
      <div class="sso-sep" id="sso-sep">ou</div>
      <a class="ms-btn" id="ms-btn" href="/api/auth/microsoft/login" hidden>
        <svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        Entrar com Microsoft
      </a>
      <a class="sso-btn" id="sso-btn" href="/api/auth/saml/login" hidden>
        <svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        Entrar com conta institucional (SAML)
      </a>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="footer">TSP &nbsp;·&nbsp; Uso interno</div>
  </div>

  <script>
    const SERVER_URL = window.location.origin;
    const AUTH_KEY   = 'zz2_auth_token';
    const ROLE_KEY   = 'zz2_auth_role';
    const DEFAULT_NEXT = '/dashboard.html';

    /* Sessions are issued by this server (8 h) and kept in localStorage under
     * AUTH_KEY; every page sends them as "Authorization: Bearer" through
     * session.js, which also sends the user back here on a 401. There is no
     * refresh token: when the session expires, the user signs in again. */

    var SSO_ERRORS = {
      cancelled: 'O login com a Microsoft foi cancelado.',
      rejected: 'Não foi possível concluir o login com a Microsoft. Tente novamente.',
      denied: 'Esta conta Microsoft não tem permissão para acessar a plataforma. Fale com um administrador.',
      expired: 'O link de login expirou. Tente novamente.'
    };

    /* Where to go after signing in: ?next=<same-site path>, else the dashboard.
     * Anything that is not a plain same-site path ("//host", "/\host",
     * "https://...") is ignored so this page cannot become an open redirect. */
    function nextPath() {
      var value = new URLSearchParams(window.location.search).get('next') || '';
      if (!/^\/[A-Za-z0-9._~\/?=&%#-]*$/.test(value) || value.indexOf('//') === 0 ||
          value.indexOf('/login.html') === 0) {
        return DEFAULT_NEXT;
      }
      return value;
    }

    function setBusy(busy) {
      var btn = document.getElementById('login-btn');
      if (btn) btn.disabled = busy;
      document.getElementById('spinner').classList.toggle('active', busy);
    }

    async function errorMessage(res, fallback) {
      if (res.status === 429) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
      try {
        var body = await res.json();
        if (body && body.error) return body.error;
      } catch (e) { /* not JSON */ }
      return fallback;
    }

    function storeSession(token, role) {
      localStorage.setItem(AUTH_KEY, token);
      localStorage.setItem(ROLE_KEY, role || 'tech');
    }

    /* Returning from Microsoft (or SAML): the server redirected to #sso=<code>,
     * a single-use code that is exchanged here for the session token. The code
     * travels in the fragment so it never reaches a server log or a Referer,
     * and the fragment is wiped from history before anything else happens. */
    async function completeSso() {
      var hash = window.location.hash || '';
      var match = /^#(sso|sso_error)=([A-Za-z0-9_.~-]+)$/.exec(hash);
      if (!match) return false;
      history.replaceState(null, '', window.location.pathname + window.location.search);
      var errEl = document.getElementById('error-msg');
      if (match[1] === 'sso_error') {
        errEl.textContent = SSO_ERRORS[match[2]] || SSO_ERRORS.rejected;
        return false;
      }
      setBusy(true);
      try {
        var res = await fetch(SERVER_URL + '/api/auth/sso/exchange', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code: match[2]})
        });
        if (!res.ok) throw new Error(await errorMessage(res, SSO_ERRORS.expired));
        var body = await res.json();
        if (!body.token) throw new Error(SSO_ERRORS.rejected);
        var who = await fetch(SERVER_URL + '/api/session/verify', {
          method: 'POST', headers: {'Authorization': 'Bearer ' + body.token}
        }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
        storeSession(body.token, who.role);
        window.location.href = body.next || nextPath();
        return true;
      } catch (err) {
        setBusy(false);
        errEl.textContent = err.message || SSO_ERRORS.rejected;
        return false;
      }
    }

    /* A token left over from an earlier visit: follow it only if the server
     * still accepts it. Redirecting on any stored token loops forever when the
     * server rejects it (the dashboard sends us back here, and the same token
     * sends us there again). */
    async function resumeSession() {
      var stored = localStorage.getItem(AUTH_KEY);
      if (!stored) return false;
      var check = await fetch(SERVER_URL + '/api/session/verify', {
        method: 'POST', headers: {'Authorization': 'Bearer ' + stored}
      }).catch(function(){ return null; });
      if (check && check.ok) {
        window.location.href = nextPath();
        return true;
      }
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(ROLE_KEY);
      return false;
    }

    async function initAuth() {
      var errEl = document.getElementById('error-msg');
      try {
        if (await completeSso()) return;
        var cfg = await fetch(SERVER_URL + '/api/config', {cache:'no-store'}).then(function(r){return r.json();});
        var next = encodeURIComponent(nextPath());
        var passwordOn = cfg.password_login_enabled !== false;
        if (!passwordOn) document.getElementById('password-block').hidden = true;
        if (cfg.microsoft_enabled || cfg.saml_enabled) {
          document.getElementById('sso-block').hidden = false;
          document.getElementById('sso-sep').hidden = !passwordOn;
        }
        if (cfg.microsoft_enabled) {
          var ms = document.getElementById('ms-btn');
          ms.href = '/api/auth/microsoft/login?next=' + next;
          ms.hidden = false;
        }
        if (cfg.saml_enabled) {
          var saml = document.getElementById('sso-btn');
          saml.href = '/api/auth/saml/login?next=' + next;
          saml.hidden = false;
        }
        if (!errEl.textContent) await resumeSession();
      } catch (err) {
        errEl.textContent = 'Não foi possível carregar a configuração de login. Recarregue a página.';
      }
    }
    window.addEventListener('load', initAuth);

    async function doLogin() {
      var email    = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errEl    = document.getElementById('error-msg');

      errEl.textContent = '';
      if (!email || !password) {
        errEl.textContent = 'Informe seu e-mail e senha.';
        return;
      }

      setBusy(true);
      try {
        var res = await fetch(SERVER_URL + '/api/auth/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: email, password: password})
        });
        if (!res.ok) throw new Error(await errorMessage(res, 'E-mail ou senha inválidos.'));
        var body = await res.json();
        if (!body.token) throw new Error('O servidor não retornou uma sessão.');
        storeSession(body.token, body.user && body.user.role);
        window.location.href = nextPath();
      } catch (err) {
        setBusy(false);
        errEl.textContent = err.message || 'E-mail ou senha inválidos.';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
<script>
/* ZZ2 theme toggle - button shows the CURRENT mode; tooltip names the action */
(function(){
  function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}
  function syncBtn(){var b=document.getElementById('themeToggle');if(!b)return;var d=isDark();
    b.textContent=d?'\ud83c\udf19':'\u2600\ufe0f';b.title=d?'Switch to light mode':'Switch to dark mode';}
  window.zz2ToggleTheme=function(){var next=isDark()?'light':'dark';
    if(next==='dark')document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    try{localStorage.setItem('zz2-theme',next);}catch(e){}
    syncBtn();};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncBtn);else syncBtn();
})();
</script>
</body>
</html>
